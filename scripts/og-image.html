<!doctype html>
<!--
  Source for public/og-image.png (the 1200x630 link preview). Re-render with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --virtual-time-budget=2000 \
    --window-size=1200,630 --screenshot=public/og-image.png scripts/og-image.html
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; font-weight: 100 900; src: url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2); }
  @font-face { font-family: Newsreader; font-weight: 200 800; src: url(../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2); }
  @font-face { font-family: Newsreader; font-style: italic; font-weight: 200 800; src: url(../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-italic.woff2); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f1ede6; font-family: Geist, sans-serif; color: #1d1d1b;
    display: flex; align-items: center; gap: 64px; padding: 0 72px 0 80px;
    -webkit-font-smoothing: antialiased;
  }
  .left { flex: 1; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 22px; letter-spacing: 0.16em; }
  .mark { width: 48px; height: 48px; border-radius: 13px; background: #1d1d1b; display: flex; align-items: center; justify-content: center; }
  h1 {
    font-family: Newsreader, serif; font-weight: 300; text-transform: uppercase;
    font-size: 74px; line-height: 1.02; letter-spacing: 0.005em; margin: 44px 0 26px;
  }
  .sub { font-size: 24px; color: #55534e; line-height: 1.45; max-width: 560px; }
  .list { margin-top: 34px; font-family: Newsreader, serif; font-style: italic; font-weight: 300; font-size: 26px; color: #55534e; }
  .list span { color: #a39c8f; padding: 0 6px; font-style: normal; }

  .stage {
    width: 384px; height: 520px; border-radius: 30px; position: relative; overflow: hidden; flex-shrink: 0;
    background: linear-gradient(180deg, #7b96ab 0%, #a3b1b8 42%, #c9c6bb 72%, #ddd2bd 100%);
    box-shadow: 0 30px 60px rgba(60, 50, 30, 0.14);
  }
  .stage svg { position: absolute; inset: 0; }
  .pill { position: absolute; top: 22px; left: 22px; background: rgba(20, 20, 19, 0.62); color: #fff; border-radius: 999px; padding: 9px 16px; font-weight: 500; font-size: 19px; }
  .pill b { font-weight: 600; }
  .pill i { font-style: normal; opacity: 0.55; }
  .result {
    position: absolute; left: 20px; right: 20px; bottom: 20px; background: #fbf9f5; border-radius: 20px;
    padding: 16px 22px 18px; display: flex; align-items: flex-end; justify-content: space-between;
  }
  .label { font-family: Newsreader, serif; font-style: italic; font-size: 17px; color: #55534e; }
  .count { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .n { font-family: Newsreader, serif; font-weight: 300; font-size: 76px; line-height: 0.9; letter-spacing: -0.02em; }
  .r { font-family: Newsreader, serif; font-style: italic; font-weight: 300; font-size: 28px; color: #55534e; }
  .note { font-size: 15px; font-weight: 500; color: #33452f; background: #e7ece4; border: 1px solid #cdd8c8; border-radius: 999px; padding: 7px 13px; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <span class="mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 16.5l4.5-6 4 3.5L19 6.5" stroke="#c9b28c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="10.5" r="1.6" fill="#f1ede6"/><circle cx="13.5" cy="14" r="1.6" fill="#f1ede6"/></svg>
      </span>
      REPCOUNTER
    </div>
    <h1>Count reps<br />from a video</h1>
    <div class="sub">Film or upload a set. Pose tracking runs in your browser, and the video never leaves your phone.</div>
    <div class="list">curls<span>·</span>squats<span>·</span>lateral raises<span>·</span>pull-ups</div>
  </div>
  <div class="stage">
    <!-- Figure at the bottom of a squat, side view, with the tracked hip, knee and ankle on top. -->
    <svg width="384" height="520" viewBox="0 0 384 520">
      <g opacity="0.8" stroke="#1d1d1b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="200" cy="104" r="24" fill="#1d1d1b" stroke="none" />
        <path d="M188 142 L150 238" />
        <path d="M184 152 L262 186" />
      </g>
      <path d="M150 238 L248 262 L214 362" stroke="#d4ad6c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <g fill="#fff" stroke="#d4ad6c" stroke-width="5">
        <circle cx="150" cy="238" r="9" /><circle cx="248" cy="262" r="11" /><circle cx="214" cy="362" r="9" />
      </g>
      <rect x="262" y="222" rx="15" width="108" height="30" fill="rgba(20,20,19,0.72)" />
      <text x="316" y="243" fill="#fff" font-family="Geist" font-weight="600" font-size="15" text-anchor="middle">41% hip drop</text>
      <path d="M96 366 L300 366" stroke="#1d1d1b" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" />
    </svg>
    <div class="pill"><b>6</b> <i>/ 6</i> reps</div>
    <div class="result">
      <div>
        <div class="label">result</div>
        <div class="count"><span class="n">6</span><span class="r">reps</span></div>
      </div>
      <span class="note">Good depth</span>
    </div>
  </div>
</body>
</html>
